function renderScreen(s){audioEl.pause();audioEl.src='audio/s'+String(s.id).padStart(2,'0')+'.mp3';audioEl.playbackRate=rate;audioEl.muted=muted;renderNav(s.chapter);content.innerHTML=`<div class="kicker">${chapters[s.chapter]} · Écran ${s.id}/12</div><div class="title">${s.title}</div><div class="grid"><div><ul class="bullets">${s.bullets.map((b,i)=>`<li data-i="${i}">${b}</li>`).join('')}</ul><div class="retain">À RETENIR · ${s.retain}</div></div><img class="visual" src="${D.images[s.image]}"></div>`;trans.innerHTML=s.sentences.map((x,i)=>`<p data-i="${i}">${x}</p>`).join('');if(muted||matchMedia('(prefers-reduced-motion: reduce)').matches)showAll();else begin(s)}
function begin(s){playing=true;play.textContent='⏸ Pause';audioEl.play().catch(e=>{if(e.name==='NotAllowedError'){showAll();playing=false}});timer=setInterval(()=>{if(!playing)return;let k=0;s.timings.forEach((t,i)=>{if(audioEl.currentTime>=t)k=i});activate(k)},100);audioEl.onended=()=>{clearInterval(timer);showAll();playing=false;play.textContent='▶ Lecture'}}
function activate(k){document.querySelectorAll('.bullets li').forEach((e,i)=>e.classList.toggle('on',i<=Math.min(k,document.querySelectorAll('.bullets li').length-1)));document.querySelectorAll('.trans p').forEach((e,i)=>e.classList.toggle('on',i==k))}function showAll(){document.querySelectorAll('.bullets li').forEach(e=>e.classList.add('on'));document.querySelectorAll('.trans p').forEach(e=>e.classList.add('on'))}
function renderQuiz(qi){audioEl.pause();audioEl.src='audio/q'+String(qi+1).padStart(2,'0')+'.mp3';audioEl.playbackRate=rate;audioEl.muted=muted;audioEl.play().catch(()=>{});renderNav(4);let q=D.quiz[qi],done=answered[qi];content.innerHTML=`<div class="kicker">Quiz final · Question ${qi+1}/5</div><div class="title">${q.q}</div>${q.o.map((o,i)=>`<button class="quizopt ${done!==undefined?(i==q.a?'good':i==done?'bad':''):''}" onclick="answer(${qi},${i})" ${done!==undefined?'disabled':''}>${String.fromCharCode(65+i)}. ${o}</button>`).join('')}<div class="retain ${done===undefined?'hidden':''}">${q.c}</div>`;trans.innerHTML=`<p class="on">${q.q}</p>${done!==undefined?`<p class="on">${q.c}</p>`:''}`}
function answer(qi,a){if(answered[qi]!==undefined)return;answered[qi]=a;renderQuiz(qi);audioEl.src='audio/c'+String(qi+1).padStart(2,'0')+'.mp3';audioEl.playbackRate=rate;audioEl.muted=muted;audioEl.play().catch(()=>{});if(Object.keys(answered).length==5){let good=D.quiz.filter((q,i)=>answered[i]==q.a).length,score=good*20;try{if(api){api.LMSSetValue('cmi.core.score.min','0');api.LMSSetValue('cmi.core.score.max','100');api.LMSSetValue('cmi.core.score.raw',String(score));api.LMSSetValue('cmi.core.lesson_status',score>=80?'passed':'failed');api.LMSCommit('')}}catch(e){}}commit()}
